name: Update AUR package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl makepkg

      - name: Update PKGBUILD and .SRCINFO
        run: |
          cd packaging
          ./update-aur.sh

      - name: Push to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          cd packaging
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          git init  # если ещё не git-репозиторий
          git remote add aur ssh://aur@aur.archlinux.org/icon-theme-toolkit.git || true
          git add PKGBUILD .SRCINFO
          git commit -m "Update to latest release" || true
          git push aur master