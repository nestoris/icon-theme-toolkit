name: Update AUR package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update PKGBUILD and .SRCINFO
        run: |
          # Устанавливаем зависимости, если нужно (например, openssh для git)
          pacman -Sy --noconfirm git openssh jq
          cd packaging
          ./update-aur.sh

      - name: Push to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          # 1. Настраиваем SSH-агент
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/aur

          # 2. Отключаем строгую проверку ключа хоста ТОЛЬКО для этой сессии
          export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          # 3. Клонируем существующий репозиторий AUR
          git clone ssh://aur@aur.archlinux.org/icon-theme-toolkit.git aur-repo
          cd aur-repo

          # 4. Копируем наш PKGBUILD
          cp ../packaging/PKGBUILD .

          # 5. Генерируем .SRCINFO
          makepkg --printsrcinfo > .SRCINFO

          # 6. Коммитим и пушим, если есть изменения
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add PKGBUILD .SRCINFO
          
          if git diff-index --quiet HEAD; then
            echo "Нет изменений для пуша в AUR."
          else
            git commit -m "Update to latest release"
            git push origin master
          fi