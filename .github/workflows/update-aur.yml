name: Update AUR package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update PKGBUILD and .SRCINFO
        run: |
          # Устанавливаем зависимости, если нужно (например, openssh для git)
          pacman -Sy --noconfirm git openssh jq
          cd packaging
          ./update-aur.sh

      - name: Push to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          # 1. Создаем обычного пользователя (makepkg нельзя запускать от root)
          useradd -m builder

          # 2. Настраиваем SSH-ключ для этого пользователя
          mkdir -p /home/builder/.ssh
          echo "$AUR_SSH_KEY" | tr -d '\r' > /home/builder/.ssh/aur
          chmod 600 /home/builder/.ssh/aur
          chown -R builder:builder /home/builder/.ssh

          # 3. Копируем PKGBUILD в /tmp, чтобы у пользователя builder были права на чтение
          cp packaging/PKGBUILD /tmp/PKGBUILD
          chown builder:builder /tmp/PKGBUILD

          # 4. Выполняем клонирование, сборку и пуш от имени пользователя builder
          su builder -c '
            eval "$(ssh-agent -s)"
            ssh-add ~/.ssh/aur
            export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
            
            cd /tmp
            git clone ssh://aur@aur.archlinux.org/icon-theme-toolkit.git aur-repo
            cd aur-repo
            
            cp /tmp/PKGBUILD .
            
            # Генерируем .SRCINFO (теперь от имени обычного пользователя)
            makepkg --printsrcinfo > .SRCINFO
            
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add PKGBUILD .SRCINFO
            
            if git diff-index --quiet HEAD; then
              echo "Нет изменений для пуша в AUR."
            else
              git commit -m "Update to latest release"
              git push origin master
            fi
          '